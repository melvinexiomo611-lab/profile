<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Melvin Exiomo — Desktop</title>
<style>
  :root{
    --sys-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono-font: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    --ink:#1d1d1f;
    --sub:#6e6e73;
    --paper:#ffffff;
    --line:#e6e6e6;
    --bar-top:#ffffff;
    --bar-bot:#f6f6f6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:var(--sys-font);
    user-select:none;
    color:var(--ink);
  }
  body{
    height:100vh; position:relative;
    background:
      radial-gradient(circle at 18% 15%, rgba(255,171,171,0.55), transparent 42%),
      radial-gradient(circle at 82% 10%, rgba(178,153,224,0.6), transparent 45%),
      radial-gradient(circle at 60% 85%, rgba(103,131,234,0.6), transparent 55%),
      radial-gradient(circle at 10% 90%, rgba(255,197,130,0.4), transparent 40%),
      linear-gradient(160deg, #2c1a52 0%, #5a4a9c 35%, #7d8fd6 65%, #f5b98f 100%);
  }

  /* ===================== BOOT / LOADING SCREEN ===================== */
  #boot{
    position:fixed; inset:0; z-index:99999;
    background: radial-gradient(circle at 50% 35%, #241848 0%, #0c0a1c 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition:opacity .6s ease, visibility .6s ease;
  }
  #boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .boot-mark{
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(135deg,#9b8cff,#5b6df0);
    box-shadow:0 0 40px rgba(120,120,255,0.55);
    animation:boot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes boot-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .boot-title{
    color:#fff; font-size:22px; font-weight:700; letter-spacing:0.14em; margin-top:6px;
  }
  .boot-sub{
    color:#b9b3d9; font-size:13px; font-weight:500; letter-spacing:0.01em; text-align:center; padding:0 20px;
  }
  .boot-bar{
    width:220px; height:5px; border-radius:4px; background:rgba(255,255,255,0.12); overflow:hidden; margin-top:6px;
  }
  .boot-bar-fill{
    height:100%; width:0%; border-radius:4px;
    background:linear-gradient(90deg,#9b8cff,#5b6df0,#6de0ff);
    animation:boot-fill 5s linear forwards;
  }
  @keyframes boot-fill{ from{ width:0%; } to{ width:100%; } }

  /* ===================== Menu bar ===================== */
  #menubar{
    position:fixed; top:0; left:0; right:0; height:26px;
    background:rgba(255,255,255,0.55); backdrop-filter:blur(20px) saturate(1.8);
    -webkit-backdrop-filter:blur(20px) saturate(1.8);
    border-bottom:1px solid rgba(0,0,0,0.08);
    display:flex; align-items:center; z-index:5000;
    padding:0 12px; font-size:13px; gap:16px; font-weight:500;
  }
  #menubar .mark{
    width:15px; height:15px; border-radius:4px; flex-shrink:0;
    background: linear-gradient(135deg,#9b8cff,#5b6df0);
  }
  #activeAppName{ font-weight:700; font-size:13px; margin-right:2px; }
  .menu-item{ position:relative; padding:3px 7px; cursor:default; border-radius:4px; color:var(--ink); }
  .menu-item:hover, .menu-item.open{ background:rgba(0,0,0,0.08); }
  .menu-dropdown{
    display:none; position:absolute; top:100%; left:0; margin-top:6px;
    background:rgba(250,250,250,0.9); backdrop-filter:blur(18px);
    border:1px solid rgba(0,0,0,0.08); border-radius:8px;
    box-shadow:0 10px 24px rgba(0,0,0,0.22);
    min-width:190px; z-index:6000; padding:4px;
  }
  .menu-item.open .menu-dropdown{ display:block; }
  .menu-dropdown div{ padding:6px 10px; font-size:12.5px; color:var(--ink); white-space:nowrap; border-radius:5px; font-weight:400;}
  .menu-dropdown div:hover{ background:#3b82f6; color:#fff; }
  .menu-dropdown hr{ border:none; border-top:1px solid rgba(0,0,0,0.08); margin:4px 2px;}
  #clock{ margin-left:auto; font-size:12.5px; padding:3px 4px; font-weight:500; }

  /* ===================== Windows ===================== */
  .window{
    position:absolute; background:var(--paper); border:1px solid rgba(0,0,0,0.12);
    border-radius:12px; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
    min-width:280px; display:flex; flex-direction:column;
    z-index:100;
    animation: pop-in .16s ease-out;
  }
  @keyframes pop-in{ from{ transform:scale(0.95); opacity:0;} to{ transform:scale(1); opacity:1;} }

  .titlebar{
    height:38px; display:flex; align-items:center;
    padding:0 14px; gap:8px; cursor:grab; position:relative;
    background:linear-gradient(var(--bar-top), var(--bar-bot));
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .titlebar:active{ cursor:grabbing; }
  .traffic{ display:flex; gap:8px; flex-shrink:0; z-index:2; }
  .traffic span{
    width:13px; height:13px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(0,0,0,0.10); cursor:pointer; font-size:9px; color:transparent; line-height:1;
    font-family:var(--sys-font); font-weight:700;
  }
  .titlebar:hover .traffic span{ color:rgba(0,0,0,0.45); }
  .tf-close{ background:#ff5f57; }
  .tf-min{ background:#febc2e; }
  .tf-zoom{ background:#28c840; }
  .titletext{
    font-size:13px; font-weight:600; color:var(--ink);
    flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:absolute; left:0; right:0; pointer-events:none;
  }

  .toolbar{
    height:38px; background:#fafafa; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; padding:0 12px; flex-shrink:0; font-size:12.5px; color:var(--sub);
  }
  .toolbar .crumb{ font-size:12.5px; color:var(--sub); font-weight:500; }

  .winbody{
    padding:20px 24px; overflow:auto; font-size:14px; line-height:1.6; color:var(--ink); flex:1;
    background:#fff; position:relative;
  }
  .winbody h2{ font-size:20px; font-weight:700; margin:0 0 14px 0; letter-spacing:-0.01em; }
  .winbody p{ margin:0 0 10px 0; color:#333; }
  .proj{
    border:1px solid var(--line); padding:14px 16px; margin-bottom:12px; background:#fbfbfb; border-radius:10px;
    transition:box-shadow .15s ease, border-color .15s ease; position:relative; z-index:1;
  }
  .proj:hover{ box-shadow:0 4px 14px rgba(0,0,0,0.08); border-color:#dcdce0; }
  .proj h3{ font-size:14px; font-weight:600; margin:0 0 6px 0; }
  .proj p{ margin:0 0 8px 0; font-size:13px; color:var(--sub); }
  .proj a, .winbody a{ color:#0a66c2; text-decoration:none; font-weight:500; }
  .proj a:hover, .winbody a:hover{ text-decoration:underline; }
  .tag{
    display:inline-block; font-size:11px; font-weight:600; color:#3a3a3c;
    border:none; padding:3px 9px; margin:0 5px 5px 0; background:#eef0f3; border-radius:20px;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .swatch{ height:76px; border-radius:10px; }
  .resize{
    position:absolute; width:18px; height:18px; right:0; bottom:0; cursor:nwse-resize;
    background: repeating-linear-gradient(135deg, rgba(0,0,0,0.35) 0 1.5px, transparent 1.5px 4px);
    opacity:0.55; z-index:5;
  }
  .resize:hover{ opacity:0.9; }

  /* ===================== THEME: Codes (programmer look) ===================== */
  .theme-codes .titlebar{ background:#323233; border-color:#1e1e1e; }
  .theme-codes .titletext{ color:#ccc; }
  .theme-codes .toolbar{ background:#2d2d30; color:#9da5b4; border-color:#1e1e1e; }
  .theme-codes .toolbar .crumb{ color:#9da5b4; font-family:var(--mono-font); }
  .theme-codes .winbody{ background:#1e1e1e; color:#d4d4d4; font-family:var(--mono-font); }
  .theme-codes .winbody h2{ color:#6a9955; font-family:var(--mono-font); }
  .theme-codes .winbody h2::before{ content:'// '; }
  .theme-codes .winbody h2::after{ content:'_'; animation:blink 1s step-end infinite; color:#6a9955; }
  @keyframes blink{ 50%{ opacity:0; } }
  .theme-codes .winbody > p{ color:#9cdcfe; font-size:12.5px; }
  .theme-codes .proj{ background:#252526; border-color:#3c3c3c; }
  .theme-codes .proj h3{ color:#dcdcaa; font-size:13px; }
  .theme-codes .proj h3::before{ content:'function '; color:#569cd6; }
  .theme-codes .proj p{ color:#ce9178; font-size:12.5px; }
  .theme-codes .tag{ background:#0e2f4f; color:#4fc1ff; font-family:var(--mono-font); border-radius:4px; }
  .theme-codes .winbody a{ color:#4fc1ff; }

  /* ===================== THEME: Graphic Design (flashy, moving gradient) ===================== */
  .theme-designs .winbody{
    background:linear-gradient(120deg,#ff6ec7,#6a5cff,#00d4ff,#ffb86c);
    background-size:300% 300%;
    animation:gradientShift 8s ease infinite;
    color:#fff;
  }
  @keyframes gradientShift{
    0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; }
  }
  .theme-designs .winbody h2{
    text-transform:uppercase; letter-spacing:0.06em; font-size:24px;
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
  }
  .theme-designs .winbody > p{ color:rgba(255,255,255,0.92); font-weight:500; }
  .theme-designs .swatch{
    border:1px solid rgba(255,255,255,0.5); box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .theme-designs .toolbar{ background:#1a1030; color:#e7d9ff; border-color:#000; }
  .theme-designs .toolbar .crumb{ color:#e7d9ff; }
  .theme-designs .titlebar{ background:linear-gradient(#2a1a4a,#1a1030); border-color:#000; }
  .theme-designs .titletext{ color:#fff; }

  /* ===================== THEME: AI Automations (live canvas background) ===================== */
  .theme-ai .winbody{ background:#0b1020; color:#dff5ec; }
  .theme-ai .winbody h2{ color:#5be8c9; text-shadow:0 0 14px rgba(91,232,201,0.5); }
  .theme-ai .winbody > p{ color:#9fb3c8; }
  .theme-ai .proj{
    background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.14); color:#dff5ec;
    backdrop-filter:blur(6px);
  }
  .theme-ai .proj h3{ color:#8be9fd; }
  .theme-ai .proj p{ color:#a9c4c0; }
  .theme-ai .tag{ background:rgba(91,232,201,0.18); color:#5be8c9; }
  .theme-ai .titlebar{ background:linear-gradient(#131a30,#0b1020); border-color:#000; }
  .theme-ai .titletext{ color:#dff5ec; }
  .theme-ai .toolbar{ background:#0e1526; color:#8fa4b8; border-color:#000; }
  .theme-ai .toolbar .crumb{ color:#8fa4b8; }
  .ai-canvas{ position:absolute; inset:0; z-index:0; }
  .theme-ai .winbody > *:not(.ai-canvas){ position:relative; z-index:1; }
  .pyapp{ background:rgba(20,26,46,0.75) !important; border-color:rgba(91,232,201,0.25) !important; }
  .pyedit{
    width:100%; min-height:150px; font-family:var(--mono-font);
    font-size:12px; line-height:1.5; background:#0d1117; color:#c9d1d9;
    border:1px solid rgba(91,232,201,0.25); border-radius:8px; padding:12px; resize:vertical;
  }
  .pyrow{ display:flex; align-items:center; gap:10px; margin:10px 0; }
  .pybtn{
    font-size:12.5px; font-weight:700; background:#28c840; color:#08350f;
    border:none; border-radius:7px; padding:8px 16px; cursor:pointer;
  }
  .pybtn:hover{ filter:brightness(1.08); }
  .pybtn:disabled{ opacity:0.6; cursor:default; }
  .pystatus{ font-size:12px; color:#8fa4b8; }
  .pyoutput{
    background:#000; color:#7cff8f; font-family:var(--mono-font);
    font-size:12px; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word;
    min-height:40px; margin:0;
  }

  /* ===================== THEME: Profile (Facebook-style) ===================== */
  .theme-about .winbody{ padding:0; background:#f0f2f5; }
  .fb-cover{
    height:120px; background:linear-gradient(120deg,#4e7fe0,#7b5cf0 60%,#c26fd8);
    position:relative;
  }
  .fb-avatar-row{ display:flex; align-items:flex-end; gap:14px; padding:0 20px; margin-top:-38px; position:relative; }
  .fb-avatar{
    width:76px; height:76px; border-radius:50%; border:4px solid #f0f2f5;
    background:linear-gradient(135deg,#8e8f97,#c9ccd4);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px; font-weight:700;
    flex-shrink:0;
  }
  .fb-name-block{ padding-bottom:6px; }
  .fb-name-block h2{ margin:0; font-size:19px; }
  .fb-tagline{ font-size:12.5px; color:var(--sub); margin:2px 0 0 0; }
  .fb-bio{ background:#fff; margin:14px 20px 20px 20px; padding:16px 18px; border-radius:10px; border:1px solid var(--line); }
  .fb-bio h3{ font-size:13px; text-transform:uppercase; letter-spacing:0.04em; color:var(--sub); margin:0 0 8px 0; }
  .fb-bio p{ font-size:13.5px; }

  /* ===================== THEME: LinkedIn (real app style, scrollable) ===================== */
  .theme-linkedin .toolbar{ background:#0a66c2; padding:0 14px; height:42px; gap:14px; }
  .li-navicon{ color:rgba(255,255,255,0.85); font-size:15px; }
  .li-search{
    flex:1; background:rgba(255,255,255,0.18); border-radius:6px; padding:6px 12px; color:#fff; font-size:12.5px;
  }
  .theme-linkedin .winbody{ padding:0; background:#f4f2ee; }
  .li-cover{ height:80px; background:linear-gradient(120deg,#0a66c2,#5b9df0); }
  .li-avatar-row{ padding:0 20px; margin-top:-36px; position:relative; }
  .li-avatar{
    width:72px; height:72px; border-radius:50%; border:3px solid #fff;
    background:linear-gradient(135deg,#c9ccd4,#8e8f97);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:700;
  }
  .li-info{ padding:10px 20px 0 20px; }
  .li-info h2{ margin:0; font-size:19px; }
  .li-headline{ font-size:13px; color:#333; margin:4px 0 2px 0; }
  .li-meta{ font-size:12px; color:var(--sub); margin:0 0 10px 0; }
  .li-btnrow{ display:flex; gap:8px; padding:0 20px 16px 20px; }
  .li-btn-primary{
    background:#0a66c2; color:#fff; border:none; border-radius:20px; padding:7px 18px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .li-btn-outline{
    background:#fff; color:#0a66c2; border:1.5px solid #0a66c2; border-radius:20px; padding:7px 18px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .li-section{ background:#fff; margin:10px 20px; padding:16px 18px; border-radius:10px; border:1px solid var(--line); }
  .li-section h3{ font-size:15px; margin:0 0 10px 0; }
  .li-section p{ font-size:13px; color:#333; }
  .li-exp-row{ display:flex; gap:12px; margin-bottom:14px; }
  .li-exp-icon{
    width:40px; height:40px; border-radius:8px; background:linear-gradient(135deg,#0a66c2,#5b9df0);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
  }
  .li-exp-role{ font-size:13.5px; font-weight:600; margin:0; }
  .li-exp-company{ font-size:12.5px; color:var(--sub); margin:1px 0; }
  .li-exp-date{ font-size:11.5px; color:#8a8a8e; margin:0; }
  .li-skill{
    display:inline-block; font-size:11.5px; font-weight:600; color:#0a66c2; background:#eaf3ff;
    padding:4px 11px; margin:0 6px 6px 0; border-radius:20px;
  }

  /* ===================== Dock ===================== */
  #dock{
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%);
    display:flex; align-items:flex-end; gap:16px;
    background:rgba(255,255,255,0.35); backdrop-filter:blur(22px) saturate(1.8);
    -webkit-backdrop-filter:blur(22px) saturate(1.8);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:20px; padding:10px 16px; z-index:4000;
    box-shadow:0 14px 34px rgba(0,0,0,0.3);
    max-width:94vw; overflow-x:auto; overflow-y:visible;
  }
  .dock-item{
    width:52px; text-align:center; cursor:pointer; position:relative;
    transition:transform .15s cubic-bezier(.2,.9,.3,1.3); flex-shrink:0;
  }
  .dock-item:hover{ transform:translateY(-10px) scale(1.14); z-index:10; }
  .icon-square{
    width:52px; height:52px; border-radius:13px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.25) inset;
    position:relative;
  }
  .icon-square svg{ width:60%; height:60%; }
  .dock-label{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%) translateY(4px);
    font-size:11px; font-weight:600; white-space:nowrap;
    background:rgba(30,30,32,0.9); color:#fff;
    border-radius:6px; padding:4px 10px; pointer-events:none;
    box-shadow:0 3px 8px rgba(0,0,0,0.25); margin-bottom:8px;
    opacity:0; visibility:hidden; transition:opacity .12s ease, transform .12s ease;
  }
  .dock-item:hover .dock-label{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
  .dock-dot{
    width:4px; height:4px; border-radius:50%; background:#3a3a3c; margin:5px auto 0 auto; opacity:0;
  }
  .dock-item.running .dock-dot{ opacity:1; }
  .dock-sep{ width:1px; align-self:stretch; background:rgba(0,0,0,0.15); margin:6px 2px; }
  #trash.trash-hover .icon-square{
    background:linear-gradient(150deg,#ff8a80,#d32f2f) !important;
    transform:scale(1.18);
  }
  @keyframes bounce{
    0%{ transform:translateY(0); } 30%{ transform:translateY(-24px); } 50%{ transform:translateY(0); }
    65%{ transform:translateY(-11px); } 80%{ transform:translateY(0); } 100%{ transform:translateY(0); }
  }
  .dock-item.bounce{ animation:bounce .55s ease; }

  @media (max-width:560px){
    .window{ min-width:88vw !important; max-width:92vw; }
    .dock-item{ width:42px; }
    .icon-square{ width:42px; height:42px; border-radius:11px; }
    .dock-label{ font-size:9.5px; }
    #dock{ gap:10px; padding:8px 12px; }
  }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-mark"></div>
  <div class="boot-title">LOADING</div>
  <div class="boot-sub">Booting you into Melvin Exiomo's profile…</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>

<div id="menubar">
  <div class="mark"></div>
  <div id="activeAppName">Finder</div>
  <div class="menu-item" data-menu="file">File
    <div class="menu-dropdown">
      <div data-open="codes">Open "Codes"</div>
      <div data-open="designs">Open "Graphic Design"</div>
      <div data-open="ai">Open "AI Automations"</div>
      <div data-open="about">Open "Profile"</div>
      <div data-open="linkedin">Open "LinkedIn Profile"</div>
    </div>
  </div>
  <div class="menu-item" data-menu="edit">Edit
    <div class="menu-dropdown">
      <div>Copy</div><div>Paste</div>
    </div>
  </div>
  <div class="menu-item" data-menu="view">View
    <div class="menu-dropdown">
      <div id="closeAll">Close All Windows</div>
    </div>
  </div>
  <div class="menu-item" data-menu="special">Special
    <div class="menu-dropdown">
      <div id="aboutThis">About This Desktop</div>
    </div>
  </div>
  <div id="clock">--:--</div>
</div>

<div id="dock">
  <div class="dock-item" data-win="codes" title="Codes">
    <div class="dock-label">Codes</div>
    <div class="icon-square" style="background:linear-gradient(150deg,#3a3f92,#171a3d);">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 6L2 12L8 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 6L22 12L16 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="dock-dot"></div>
  </div>
  <div class="dock-item" data-win="designs" title="Graphic Design">
    <div class="dock-label">Graphic Design</div>
    <div class="icon-square" style="background:linear-gradient(150deg,#ff8a65,#e5417a 60%,#8e44ec);">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="2.6" fill="#fff"/><circle cx="16" cy="8" r="2.6" fill="#fff" opacity="0.8"/><circle cx="8" cy="16" r="2.6" fill="#fff" opacity="0.8"/><circle cx="16" cy="16" r="2.6" fill="#fff" opacity="0.6"/></svg>
    </div>
    <div class="dock-dot"></div>
  </div>
  <div class="dock-item" data-win="ai" title="AI Automations">

<script>
  // ---- boot screen ----
  setTimeout(()=>{
    document.getElementById('boot').classList.add('hide');
  }, 5000);

  function tick(){
    const d = new Date();
    let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h===0) h = 12;
    document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
  }
  tick(); setInterval(tick, 15000);

  document.querySelectorAll('.menu-item').forEach(item=>{
    item.addEventListener('click', (e)=>{
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
      e.stopPropagation();
    });
  });
  document.addEventListener('click', ()=>{
    document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('open'));
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openWindow(el.getAttribute('data-open')) );
  });
  document.getElementById('aboutThis').addEventListener('click', ()=>{
    alert('A desktop-style portfolio.\nClick a Dock icon to open it like an app.\nDrag windows by their title bar, resize from the corner, and drag a window onto the Trash to close it.');
  });
  document.getElementById('closeAll').addEventListener('click', ()=>{
    Object.keys(openWins).forEach(k=> closeWindow(k));
  });

  const titles = {
    codes: 'Codes', designs: 'Graphic Design', ai: 'AI Automations',
    about: 'Profile', linkedin: 'LinkedIn Profile'
  };
  const crumbs = {
    codes: 'Macintosh HD ▸ Portfolio ▸ Codes',
    designs: 'Macintosh HD ▸ Portfolio ▸ Graphic Design',
    ai: 'Macintosh HD ▸ Portfolio ▸ AI Automations'
  };

  let zTop = 100;
  const openWins = {};
  const aiRuntime = {}; // key -> { raf, ro }

  function setActiveApp(name){
    document.getElementById('activeAppName').textContent = name;
  }
  function dockItemFor(key){
    return document.querySelector('.dock-item[data-win="'+key+'"]');
  }

  function toolbarFor(key){
    if(key === 'linkedin'){
      return `<div class="toolbar">
        <span class="li-navicon">⌂</span><span class="li-navicon">👥</span>
        <div class="li-search">Search</div>
        <span class="li-navicon">💬</span><span class="li-navicon">🔔</span>
      </div>`;
    }
    if(key === 'about'){
      return '';
    }
    return `<div class="toolbar"><span class="crumb">${crumbs[key] || titles[key]}</span></div>`;
  }

  function openWindow(key){
    if(!key) return;
    if(openWins[key]){
      bringToFront(openWins[key]);
      setActiveApp(titles[key]);
      return;
    }
    const tpl = document.getElementById('tpl-'+key);
    if(!tpl) return;

    const dockEl = dockItemFor(key);
    if(dockEl){
      dockEl.classList.add('bounce');
      setTimeout(()=> dockEl.classList.remove('bounce'), 550);
      dockEl.classList.add('running');
    }

    const win = document.createElement('div');
    win.className = 'window theme-' + key;
    const isMobile = window.innerWidth < 560;
    const w = isMobile ? Math.floor(window.innerWidth*0.9) : 440;
    const openCount = Object.keys(openWins).length;
    const left = isMobile ? Math.floor(window.innerWidth*0.05) : (100 + openCount*30);
    const top = isMobile ? 46 : (50 + openCount*28);
    win.style.width = w+'px';
    win.style.left = left+'px';
    win.style.top = top+'px';
    win.style.maxHeight = (window.innerHeight - top - 100) + 'px';

    win.innerHTML = `
      <div class="titlebar">
        <div class="traffic">
          <span class="tf-close" title="Close">&#10005;</span><span class="tf-min" title="Minimize">&#8722;</span><span class="tf-zoom" title="Zoom">&#10021;</span>
        </div>
        <div class="titletext">${titles[key]}</div>
      </div>
      ${toolbarFor(key)}
      <div class="winbody"></div>
      <div class="resize" title="Drag to resize"></div>
    `;
    win.querySelector('.winbody').appendChild(tpl.content.cloneNode(true));
    document.body.appendChild(win);
    openWins[key] = win;
    bringToFront(win);
    setActiveApp(titles[key]);

    if(key === 'ai'){
      setupPyRunner(win);
      setupAIBackground(win, key);
    }

    win.querySelector('.tf-close').addEventListener('click', (e)=>{
      e.stopPropagation();
      closeWindow(key);
    });
    win.querySelector('.tf-min').addEventListener('click', (e)=>{
      e.stopPropagation();
      minimizeWindow(key);
    });
    win.querySelector('.tf-zoom').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleZoom(win);
    });

    win.addEventListener('mousedown', ()=>{ bringToFront(win); setActiveApp(titles[key]); });
    win.addEventListener('touchstart', ()=>{ bringToFront(win); setActiveApp(titles[key]); }, {passive:true});

    makeWindowDraggable(win, key);
    makeWindowResizable(win);
  }

  function teardownAI(key){
    const rt = aiRuntime[key];
    if(!rt) return;
    if(rt.raf) cancelAnimationFrame(rt.raf);
    if(rt.ro) rt.ro.disconnect();
    delete aiRuntime[key];
  }

  function closeWindow(key){
    const win = openWins[key];
    if(!win) return;
    teardownAI(key);
    win.remove();
    delete openWins[key];
    const dockEl = dockItemFor(key);
    if(dockEl) dockEl.classList.remove('running');
    setActiveApp('Finder');
  }

  function minimizeWindow(key){
    const win = openWins[key];
    if(!win) return;
    win.style.display = 'none';
    win.dataset.minimized = '1';
    setActiveApp('Finder');
  }

  function toggleZoom(win){
    if(win.dataset.zoomed === '1'){
      win.style.width = win.dataset.prevW;
      win.style.height = win.dataset.prevH;
      win.style.left = win.dataset.prevL;
      win.style.top = win.dataset.prevT;
      win.dataset.zoomed = '0';
    } else {
      win.dataset.prevW = win.style.width;
      win.dataset.prevH = win.style.height;
      win.dataset.prevL = win.style.left;
      win.dataset.prevT = win.style.top;
      win.style.left = '3vw';
      win.style.top = '40px';
      win.style.width = '94vw';
      win.style.height = (window.innerHeight - 120) + 'px';
      win.dataset.zoomed = '1';
    }
  }

  document.querySelectorAll('.dock-item[data-win]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-win');
      const win = openWins[key];
      if(win && win.dataset.minimized === '1'){
        win.style.display = 'flex';
        win.dataset.minimized = '0';
        bringToFront(win);
        setActiveApp(titles[key]);
        return;
      }
      openWindow(key);
    });
  });

  function bringToFront(win){
    zTop += 1;
    win.style.zIndex = zTop;
  }

  function rectsOverlap(a, b){
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }

  function dropOnTrashIfNeeded(win, key){
    const trash = document.getElementById('trash');
    const wr = win.getBoundingClientRect();
    const tr = trash.getBoundingClientRect();
    trash.classList.remove('trash-hover');
    if(rectsOverlap(wr, tr)){
      const tcx = tr.left + tr.width/2, tcy = tr.top + tr.height/2;
      win.style.transition = 'all .25s ease';
      win.style.left = (tcx - wr.width/2) + 'px';
      win.style.top = (tcy - wr.height/2) + 'px';
      win.style.transform = 'scale(0.05)';
      win.style.opacity = '0';
      setTimeout(()=> closeWindow(key), 240);
      return true;
    }
    return false;
  }

  function checkTrashHover(win){
    const trash = document.getElementById('trash');
    const wr = win.getBoundingClientRect();
    const tr = trash.getBoundingClientRect();
    if(rectsOverlap(wr, tr)) trash.classList.add('trash-hover');
    else trash.classList.remove('trash-hover');
  }

  function makeWindowDraggable(win, key){
    const bar = win.querySelector('.titlebar');
    let dragging=false, sx,sy,ox,oy;
    bar.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.traffic')) return;
      dragging=true; sx=e.clientX; sy=e.clientY; ox=win.offsetLeft; oy=win.offsetTop;
      bringToFront(win); setActiveApp(titles[key]);
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e)=>{
      if(!dragging) return;
      win.style.left = Math.max(0, ox + (e.clientX-sx)) + 'px';
      win.style.top = Math.max(26, oy + (e.clientY-sy)) + 'px';
      checkTrashHover(win);
    });
    window.addEventListener('mouseup', ()=>{
      if(!dragging) return;
      dragging=false;
      dropOnTrashIfNeeded(win, key);
    });

    let tdragging=false, tsx,tsy,tox,toy;
    bar.addEventListener('touchstart', (e)=>{
      if(e.target.closest('.traffic')) return;
      const t=e.touches[0];
      tdragging=true; tsx=t.clientX; tsy=t.clientY; tox=win.offsetLeft; toy=win.offsetTop;
      bringToFront(win); setActiveApp(titles[key]);
    }, {passive:true});
    bar.addEventListener('touchmove', (e)=>{
      if(!tdragging) return;
      const t=e.touches[0];
      win.style.left = Math.max(0, tox + (t.clientX-tsx)) + 'px';
      win.style.top = Math.max(26, toy + (t.clientY-tsy)) + 'px';
      checkTrashHover(win);
    }, {passive:true});
    bar.addEventListener('touchend', ()=>{
      if(!tdragging) return;
      tdragging=false;
      dropOnTrashIfNeeded(win, key);
    });
  }

  function makeWindowResizable(win){
    const handle = win.querySelector('.resize');
    let resizing=false, sx,sy,sw,sh;
    handle.addEventListener('mousedown', (e)=>{
      resizing=true; sx=e.clientX; sy=e.clientY;
      sw=win.offsetWidth; sh=win.offsetHeight;
      e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('mousemove', (e)=>{
      if(!resizing) return;
      win.style.width = Math.max(260, sw + (e.clientX-sx)) + 'px';
      win.style.height = Math.max(180, sh + (e.clientY-sy)) + 'px';
    });
    window.addEventListener('mouseup', ()=> resizing=false);
  }

  // open Codes by default so the desktop doesn't feel empty on load
  openWindow('codes');

  // ---- Real, in-browser Python execution (Pyodide) for the AI Automations app ----
  let pyodideInstance = null;
  let pyodideLoading = null;

  function loadPyodideOnce(){
    if(pyodideInstance) return Promise.resolve(pyodideInstance);
    if(pyodideLoading) return pyodideLoading;
    pyodideLoading = new Promise((resolve, reject)=>{
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
      script.onload = async ()=>{
        try{
          pyodideInstance = await window.loadPyodide();
          resolve(pyodideInstance);
        } catch(err){ reject(err); }
      };
      script.onerror = ()=> reject(new Error('Could not load the Python runtime.'));
      document.head.appendChild(script);
    });
    return pyodideLoading;
  }

  function setupPyRunner(win){
    const runBtn = win.querySelector('#pyRun');
    const codeBox = win.querySelector('#pyCode');
    const output = win.querySelector('#pyOutput');
    const status = win.querySelector('#pyStatus');
    if(!runBtn) return;

    runBtn.addEventListener('click', async ()=>{
      runBtn.disabled = true;
      status.textContent = pyodideInstance ? 'Running…' : 'Loading Python runtime (first run only)…';
      output.textContent = '';
      try{
        const py = await loadPyodideOnce();
        status.textContent = 'Running…';
        py.setStdout({ batched: (s)=>{ output.textContent += s + '\n'; } });
        py.setStderr({ batched: (s)=>{ output.textContent += s + '\n'; } });
        await py.runPythonAsync(codeBox.value);
        status.textContent = 'Done ✓';
      } catch(err){
        output.textContent += '\n' + err;
        status.textContent = 'Error';
      } finally {
        runBtn.disabled = false;
      }
    });
  }

  // ---- Live animated "neural network" canvas background for AI Automations ----
  function setupAIBackground(win, key){
    const body = win.querySelector('.winbody');
    const canvas = document.createElement('canvas');
    canvas.className = 'ai-canvas';
    body.insertBefore(canvas, body.firstChild);
    const ctx = canvas.getContext('2d');

    function size(){
      canvas.width = body.clientWidth;
      canvas.height = body.clientHeight;
    }
    size();

    const N = 34;
    const pts = Array.from({length:N}, ()=>({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      vx: (Math.random()-0.5)*0.35,
      vy: (Math.random()-0.5)*0.35
    }));

    function frame(){
      ctx.fillStyle = 'rgba(11,16,32,0.35)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      pts.forEach(p=>{
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
      });
      for(let i=0;i<N;i++){
        for(let j=i+1;j<N;j++){
          const dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if(d < 120){
            ctx.strokeStyle = 'rgba(91,232,201,' + (0.18*(1-d/120)) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
          }
        }
      }
      pts.forEach(p=>{
        ctx.fillStyle = 'rgba(139,233,253,0.85)';
        ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
      });
      aiRuntime[key].raf = requestAnimationFrame(frame);
    }

    const ro = new ResizeObserver(()=> size());
    ro.observe(body);
    aiRuntime[key] = { raf:null, ro };
    frame();
  }
</script>
